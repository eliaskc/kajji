name: Release

# npm trusted publishing is bound to this filename. Do not rename it.
#
# Manual run on main:
#   prepare-and-release  agent drafts notes → commit to main → build → publish
#   prepare-pr           agent drafts notes → PR (merging it releases)
#   release              release the prepared, untagged package.json version on main
# A merged PR with the `release` label also releases.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [prepare-and-release, prepare-pr, release]
        default: prepare-and-release
      bump:
        description: "Version bump for prepare actions. auto lets the agent decide."
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"
  JJ_VERSION: "0.45.1"

jobs:
  # ---------------------------------------------------------------------------
  # The agent gets read-only tools, no GitHub token, and no write access. It
  # returns a JSON proposal that scripts/prepare-release.ts validates.
  # ---------------------------------------------------------------------------
  propose:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.action != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PI_VERSION: ${{ vars.RELEASE_PI_VERSION || '0.87.1' }}
      PI_MODEL: ${{ vars.RELEASE_PI_MODEL || 'opencode/claude-opus-5-5' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate agent configuration
        run: |
          [[ "$PI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::RELEASE_PI_VERSION must be an exact x.y.z version"; exit 1; }
          [[ "$PI_MODEL" == */* && "$PI_MODEL" != *$'\n'* ]] || { echo "::error::RELEASE_PI_MODEL must be provider/model"; exit 1; }

      - name: Install pinned pi
        run: npm install --global --ignore-scripts "@earendil-works/pi-coding-agent@$PI_VERSION"

      # bunfig.toml preloads @opentui/solid for bun test.
      - run: bun install --frozen-lockfile

      - name: Test release preparation
        run: bun test tests/unit/scripts/prepare-release.test.ts

      - name: Collect release context
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-proposal"
          bun run scripts/prepare-release.ts context --bump "$BUMP" --output "$RUNNER_TEMP/release-proposal/context.json"

      - name: Draft release proposal
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/release-pi
          PI_OFFLINE: "1"
        run: |
          pi --version
          pi -p --model "$PI_MODEL" --tools read,grep,find,ls \
            --no-approve --no-skills --no-context-files --no-extensions \
            --no-prompt-templates --no-themes --no-session \
            @.github/release-notes-prompt.md "@$RUNNER_TEMP/release-proposal/context.json" \
            > "$RUNNER_TEMP/release-proposal/proposal.json"

      - name: Validate proposal
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          bun run scripts/prepare-release.ts apply \
            --context "$RUNNER_TEMP/release-proposal/context.json" \
            --proposal "$RUNNER_TEMP/release-proposal/proposal.json" \
            --body "$RUNNER_TEMP/release-body.md"
          cat "$RUNNER_TEMP/release-body.md" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- pi `%s`, model `%s`\n- bump input: `%s`\n- triggered by @%s\n' \
            "$PI_VERSION" "$PI_MODEL" "$BUMP" "$GITHUB_ACTOR" > "$RUNNER_TEMP/release-proposal/agent.md"

      - uses: actions/upload-artifact@v6
        with:
          name: release-proposal
          path: ${{ runner.temp }}/release-proposal/
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # prepare-pr: apply the proposal on a fresh checkout and open the release PR.
  # ---------------------------------------------------------------------------
  prepare-pr:
    needs: propose
    if: inputs.action == 'prepare-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@v7
        with:
          name: release-proposal
          path: ${{ runner.temp }}/release-proposal

      - name: Apply validated proposal
        id: release
        run: |
          VERSION=$(bun run scripts/prepare-release.ts apply \
            --context "$RUNNER_TEMP/release-proposal/context.json" \
            --proposal "$RUNNER_TEMP/release-proposal/proposal.json" \
            --body "$RUNNER_TEMP/release-body.md")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          printf '\n' >> "$RUNNER_TEMP/release-body.md"
          cat "$RUNNER_TEMP/release-proposal/agent.md" >> "$RUNNER_TEMP/release-body.md"

      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: release/next
          base: main
          delete-branch: true
          add-paths: |
            package.json
            CHANGELOG.md
          commit-message: "release: v${{ steps.release.outputs.version }}"
          title: "release: v${{ steps.release.outputs.version }}"
          labels: release
          body-path: ${{ runner.temp }}/release-body.md

  # ---------------------------------------------------------------------------
  # Unit tests, typecheck, and lint on the commit being released (or, for
  # prepare-and-release, on the base commit before the release commit is
  # pushed; the release commit only changes package.json and CHANGELOG.md).
  # ---------------------------------------------------------------------------
  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       inputs.action != 'prepare-pr') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install jj
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jj"
          gh release download "v$JJ_VERSION" --repo jj-vcs/jj \
            --pattern "jj-v$JJ_VERSION-x86_64-unknown-linux-musl.tar.gz" --output - \
            | tar -xz -C "$RUNNER_TEMP/jj" ./jj
          echo "$RUNNER_TEMP/jj" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/jj/jj" --version

      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun lint
      - name: Unit tests
        env:
          JJ_USER: kajji-ci
          JJ_EMAIL: kajji-ci@users.noreply.github.com
        run: bun run test

  # ---------------------------------------------------------------------------
  # prepare-and-release: commit the validated proposal directly to main after
  # verify passes. Fails if main moved since the proposal; run again then.
  # ---------------------------------------------------------------------------
  commit:
    needs: [propose, verify]
    if: inputs.action == 'prepare-and-release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@v7
        with:
          name: release-proposal
          path: ${{ runner.temp }}/release-proposal

      - name: Commit and push release
        id: commit
        run: |
          set -euo pipefail
          VERSION=$(bun run scripts/prepare-release.ts apply \
            --context "$RUNNER_TEMP/release-proposal/context.json" \
            --proposal "$RUNNER_TEMP/release-proposal/proposal.json" \
            --body "$RUNNER_TEMP/release-body.md")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "release: v$VERSION"
          # Not forced: fails if main moved after the proposal was drafted.
          git push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Resolve the commit and version to release.
  # ---------------------------------------------------------------------------
  source:
    needs: commit
    if: >-
      !cancelled() && (
        (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
         contains(github.event.pull_request.labels.*.name, 'release')) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
         inputs.action == 'release') ||
        (inputs.action == 'prepare-and-release' && needs.commit.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release source
        id: source
        env:
          COMMIT_SHA: ${{ needs.commit.outputs.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # Event SHAs are stable when jobs are re-run; do not resolve a moving main again.
          SHA=${COMMIT_SHA:-${MERGE_SHA:-$GITHUB_SHA}}
          git merge-base --is-ancestor "$SHA" origin/main || fail "$SHA is not on main"
          VERSION=$(git show "$SHA:package.json" | jq -r .version)
          TAG="v$VERSION"

          # A tag at the same commit means a re-run after the tag was pushed.
          if EXISTING=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            [[ "$EXISTING" == "$SHA" ]] || fail "$TAG is already released at $EXISTING. Run prepare-and-release or prepare-pr."
          fi
          git show "$SHA:CHANGELOG.md" | grep -qx "## $VERSION" || fail "CHANGELOG.md has no section for $VERSION"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          printf -- '- version: `%s`\n- source: `%s`\n' "$VERSION" "$SHA" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Build platform binaries on native runners and smoke-test each one.
  # ---------------------------------------------------------------------------
  build:
    needs: [source, verify]
    if: >-
      !cancelled() && needs.source.result == 'success' && needs.verify.result == 'success'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Build binary
        run: bun run scripts/build.ts --target ${{ matrix.target }}

      - name: Smoke-test binary
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          OUTPUT=$("dist/kajji-${{ matrix.target }}/bin/kajji" --version)
          echo "$OUTPUT"
          [[ "$OUTPUT" == *"$VERSION"* ]] || { echo "::error::binary reports '$OUTPUT', expected $VERSION"; exit 1; }

      - name: Upload platform package
        uses: actions/upload-artifact@v6
        with:
          name: kajji-${{ matrix.target }}
          path: dist/kajji-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish npm packages, then tag, create the GitHub release, and update
  # Homebrew. Every step is safe to re-run after a partial failure.
  # ---------------------------------------------------------------------------
  publish:
    needs: [source, build]
    if: >-
      !cancelled() && needs.source.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: kajji-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.source.outputs.version }}
      SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: Download platform artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: kajji-*
          path: artifacts

      - name: Reassemble dist/
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in artifacts/kajji-*; do
            target=$(basename "$dir")
            mkdir -p "dist/$target"
            cp -r "$dir"/. "dist/$target"/
            chmod +x "dist/$target/bin/kajji"
          done
          ls -la dist/

      - name: Extract release notes
        run: |
          set -euo pipefail
          bun run scripts/extract-release-notes.ts "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      # publish.ts also writes the release archives that the tap formula hashes.
      - name: Publish to npm
        env:
          SKIP_BUILD: "1"
        run: bun run scripts/publish.ts --skip-build

      # Abort before tagging if the tap is misconfigured. npm publish is
      # idempotent, so a re-run after fixing the tap continues from here.
      - name: Pre-flight Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bun run scripts/update-homebrew-tap.ts --check "$VERSION"

      # The tag is created only after npm publish succeeds, so a failed
      # release does not leave a tag behind.
      - name: Create and push release tag
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          git fetch --tags --force origin
          if EXISTING=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            [[ "$EXISTING" == "$SHA" ]] || { echo "::error::$TAG already exists at $EXISTING"; exit 1; }
            echo "$TAG already points at $SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$SHA"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/kajji-darwin-arm64.zip
            dist/kajji-darwin-x64.zip
            dist/kajji-linux-x64.tar.gz
            dist/kajji-linux-arm64.tar.gz

      # Push the tap update only after the GitHub release exists so brew users
      # never see a formula whose download URLs 404.
      - name: Push Homebrew tap update
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bun run scripts/update-homebrew-tap.ts --push "$VERSION"
